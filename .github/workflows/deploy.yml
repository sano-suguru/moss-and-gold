# 確かめて、Cloudflare Workers（静的アセット）へ公開する。
#
# - PR（作ったとき・push したとき）：
#     check   … npm ci → typecheck → npm test → npm run check（失敗すれば PR のチェックが赤）
#     preview … npm run build → wrangler versions upload（本番には出さないバージョン）→ プレビューの URL を PR にコメント
#               （同じ PR では一つのコメントを書き換える。URL はバージョンごとのものと、PR ごとに変わらない pr-<番号> のエイリアス）
#               フォークからの PR では Secrets を使えないので、プレビューは作らない。
#               PR が閉じられたら（マージしたときも）、プレビューのバージョンは preview-cleanup.yml が消す。
# - main への push：typecheck → npm test → npm run build → wrangler deploy（本番）→ 閉じた PR のプレビューの残りを消す
#               （マージの直後は PR のプレビューがいちばん新しいバージョンで消せないので、本番の公開のあとに消す）
#
# 要るもの：リポジトリの Secrets に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID。無ければ公開だけ飛ばす。
# プレビューの URL は wrangler.jsonc の workers_dev と preview_urls（どちらも true）で有効にしてある。
name: deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── PR：確かめ ──
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # npm run check はベース（PR の行き先の main）の src を git から取り出す
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: main のシミュレーションのキャッシュを取得する（あれば。無ければ check が0日目から実行する）
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/analysis/simcache.mjs fetch --ref "$BASE" || true
      - name: npm run check（ベース＝PR の行き先の10日目のスナップショットから、PR のコードで）
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run check -- --base "$BASE"

  # ── PR：プレビュー ──
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }} # PR のブランチの先頭（マージ後の姿ではなく、push したもの）
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: プレビューのバージョンをアップロードする（本番には出さない）
        id: up
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-out.ndjson
        run: |
          npx wrangler versions upload --preview-alias "pr-$PR" --message "PR #$PR ${SHA:0:7}"
          node -e '
            const fs = require("fs");
            const r = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8").split("\n").filter(Boolean).map(JSON.parse).filter((e) => e.type === "version-upload").pop();
            if (!r) throw new Error("wrangler の出力に version-upload が無い");
            const out = [`url=${r.preview_url ?? ""}`, `alias=${r.preview_alias_url ?? ""}`, `version=${r.version_id ?? ""}`];
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
            console.log(out.join("\n"));
          '
      - name: PR にプレビューの URL を書く（一つのコメントを書き換える）
        if: steps.up.outcome == 'success'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.up.outputs.url }}
          ALIAS: ${{ steps.up.outputs.alias }}
          VERSION: ${{ steps.up.outputs.version }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- moss-and-gold-preview -->';
            const { URL, ALIAS, VERSION, SHA } = process.env;
            const lines = [
              marker,
              '### 🌿 プレビュー（Cloudflare Workers、本番には出ていないバージョン）',
              '',
              ALIAS ? `- この PR の最新：${ALIAS}` : null,
              URL ? `- このコミット（\`${SHA.slice(0, 7)}\`）のバージョン：${URL}` : null,
              '',
              `<sub>バージョン ${VERSION}・${new Date().toISOString().replace('T', ' ').slice(0, 16)} UTC に更新。push するたびにこのコメントを書き換えます。末尾に \`#lit\`・\`#clean\`・\`#fxdemo\` なども付けられます。</sub>`,
            ].filter((l) => l !== null);
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Secrets が無いのでプレビューを飛ばした
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN が無いのでプレビューを飛ばしました（ビルドまでは通っています）"

  # ── main：本番 ──
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # 閉じた PR のプレビューを消すとき、開いている PR を調べる
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test # npm run check は PR で済んでいる
      - run: npm run build
      - name: 本番へ公開
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: 閉じた PR のプレビューの残りを消す（tools/preview-cleanup.mjs）
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true # 消せなくても本番の公開は済んでいるので、失敗にしない
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/preview-cleanup.mjs --closed
      - name: Secrets が無いので公開を飛ばした
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN が無いので公開を飛ばしました（ビルドまでは通っています）"
