<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moss &amp; Gold — A Living Dungeon Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #ebe4d0;
  --ink-dim: #a8a192;
  --plaque: rgba(20, 18, 31, 0.86);
  --edge: #34304a;
  --edge-hi: #5b5470;
  --torch: #ffb36b;
  --torch-ink: #2b1906;
  --night: #06050b;
  --danger: #ff8a7a;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #ebe4d0;
    --ink-dim: #a8a192;
    --plaque: rgba(20, 18, 31, 0.86);
    --edge: #34304a;
    --edge-hi: #5b5470;
    --torch: #ffb36b;
    --torch-ink: #2b1906;
    --night: #06050b;
    --danger: #ff8a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #ebe4d0;
  --ink-dim: #a8a192;
  --plaque: rgba(20, 18, 31, 0.86);
  --edge: #34304a;
  --edge-hi: #5b5470;
  --torch: #ffb36b;
  --torch-ink: #2b1906;
  --night: #06050b;
  --danger: #ff8a7a;
  color-scheme: dark;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%;
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: "DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
#game { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv:active { cursor: grabbing; }
.hud { position: absolute; z-index: 2; }
.top-left { top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); }
.top-right { top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.bottom-right { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); }
.bottom-left { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); }
.plaque { background: var(--plaque); border: 2px solid var(--edge); border-top-color: var(--edge-hi); padding: 6px; }
button {
  font: inherit; font-size: 14px; line-height: 1; color: var(--ink);
  background: transparent; border: 2px solid transparent;
  padding: 6px 10px; min-height: 44px; min-width: 44px; cursor: pointer;
}
button:hover { border-color: var(--edge-hi); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--torch); outline-offset: 1px; }
.seg { display: flex; gap: 2px; }
.seg button[aria-pressed="true"] { background: var(--torch); color: var(--torch-ink); }
.clock { margin-top: 6px; padding: 0 4px; font-size: 13px; color: var(--ink-dim); }
.panel { display: flex; flex-direction: column; gap: 8px; width: min(300px, calc(100vw - 24px)); padding: 12px; }
.panel label { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
.panel input { font: inherit; font-size: 16px; color: var(--ink); background: var(--night); border: 2px solid var(--edge); padding: 8px; -webkit-user-select: text; user-select: text; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row button { border-color: var(--edge-hi); }
.zoom { display: flex; align-items: center; gap: 2px; padding: 4px; }
.zoom span { min-width: 2.6em; text-align: center; font-size: 14px; }
.zoom button { min-width: 44px; font-size: 20px; }
/* たためる部品 */
.fold { font-size: 13px; color: var(--ink-dim); min-height: 36px; min-width: 36px; padding: 4px 8px; }
.collapsed .body { display: none !important; }
.ctl-head { display: flex; align-items: center; gap: 6px; }
.ctl .chip { display: none; font-size: 14px; color: var(--ink); }
.ctl.collapsed .chip { display: inline; }
.ctl.collapsed .seg { display: none; }
.mapbox { display: flex; flex-direction: column; align-items: flex-end; }
.mapbox .head { display: flex; justify-content: flex-end; }
/* 生き物の札 */
.card { position: absolute; z-index: 3; pointer-events: auto; max-width: min(260px, calc(100vw - 24px)); padding: 8px 10px 8px 12px; font-size: 13px; line-height: 1.5; color: var(--ink); }
.card .t { font-size: 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .t button { min-height: 32px; min-width: 32px; padding: 2px 6px; font-size: 14px; color: var(--ink-dim); }
.card ul { list-style: none; margin: 4px 0 0; padding: 0; color: var(--ink-dim); }
.card::after { content: ''; position: absolute; left: var(--tail, 50%); bottom: -9px; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--edge); border-bottom: 0; }
.hint { font-size: 13px; line-height: 1.5; color: var(--ink-dim); padding: 8px 10px; max-width: calc(100vw - 190px); transition: opacity 0.8s; }
.hint.gone { opacity: 0; pointer-events: none; }
body.clean .hud { display: none !important; }
/* ミニマップ */
.mini { padding: 4px; line-height: 0; }
.mini canvas { display: block; width: 192px; height: 144px; image-rendering: pixelated; cursor: pointer; }
/* 記録 */
.log { width: min(340px, calc(100vw - 180px)); padding: 6px 8px; font-size: 12px; line-height: 1.45; color: var(--ink-dim); }
.log .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.log .head button { font-size: 12px; padding: 3px 8px; }
.log ul { list-style: none; margin: 4px 0 0; padding: 0; max-height: 6.2em; overflow: hidden; }
.log.collapsed ul, .log.collapsed #logToggle { display: none; }
.log.collapsed { width: auto; }
.mini .head { line-height: 1; margin-bottom: 2px; }
.log.open ul { max-height: 46vh; overflow-y: auto; }
.log li button { display: block; width: 100%; text-align: left; font: inherit; font-size: 12px; line-height: 1.45; color: var(--ink); background: none; border: 0; padding: 1px 0; cursor: pointer; }
.log li button:hover, .log li button:focus-visible { color: #fff; text-decoration: underline; }
.log li .t { color: var(--ink-dim); margin-right: 6px; }
@media (max-width: 520px) { .mini canvas { width: 128px; height: 96px; } .log { width: calc(100vw - 150px); } }
.error {
  position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: var(--night); color: var(--danger); font-size: 15px; line-height: 1.8; text-align: center;
}
@media (max-width: 520px) {
  .seg button { padding: 4px 4px; font-size: 14px; min-width: 40px; }
  .seg .long { display: none; }
  .ctl .fold { min-width: 30px; padding: 4px; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv" aria-label="ダンジョンの眺め"></canvas>
  <div class="hud top-left">
    <div id="ctl" class="plaque ctl">
      <div class="ctl-head">
        <div class="seg" role="group" aria-label="時間の速さ">
          <button type="button" data-speed="0"><span class="long">一時</span>停止</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="3">3×</button><button type="button" data-speed="10">10×</button><button type="button" data-speed="30">30×</button>
        </div>
        <span class="chip" id="ctlChip"></span>
        <button type="button" class="fold" id="ctlFold" aria-expanded="true" aria-label="操作盤をたたむ">▴</button>
      </div>
      <div class="body">
        <div id="clock" class="clock" aria-live="polite"></div>
        <div id="nutri" class="clock" title="生き物が使える養分（開いた場所の土、苔、キノコ、生き物）と、一日前からの増減"></div>
      </div>
    </div>
  </div>
  <div class="hud top-right">
    <button type="button" id="seedToggle" class="plaque" aria-expanded="false" aria-controls="seedPanel">シード</button>
    <div id="mapbox" class="plaque mini mapbox">
      <div class="head"><button type="button" class="fold" id="mapFold" aria-expanded="true">地図 ▴</button></div>
      <div class="body"><canvas id="mini" aria-label="ミニマップ。触れるとその場所へ移動します"></canvas></div>
    </div>
    <div id="seedPanel" class="plaque panel" hidden>
      <label for="seedInput">同じ言葉からは、いつも同じダンジョンが生まれます</label>
      <input id="seedInput" type="text" autocomplete="off" spellcheck="false" maxlength="40">
      <div class="row">
        <button type="button" id="seedGo">この言葉で作る</button>
        <button type="button" id="seedNew">新しいダンジョン</button>
      </div>
    </div>
  </div>
  <div class="hud bottom-right plaque zoom">
    <button type="button" id="zoomOut" aria-label="縮小">−</button><span id="zoomLabel">2×</span><button type="button" id="zoomIn" aria-label="拡大">＋</button>
  </div>
  <div id="log" class="hud bottom-left plaque log">
    <div class="head"><span>記録</span><span><button type="button" id="logToggle" aria-expanded="false">広げる</button><button type="button" class="fold" id="logFold" aria-expanded="true" aria-label="記録をたたむ">▾</button></span></div>
    <ul id="logList" aria-live="polite"><li><span class="t"></span>ドラッグで移動、ホイールか二本指で拡大縮小</li></ul>
  </div>
  <div id="card" class="hud plaque card" hidden role="status" aria-live="polite">
    <div class="t"><span id="cardTitle"></span><button type="button" id="cardClose" aria-label="閉じる">×</button></div>
    <ul id="cardLines"></ul>
  </div>
  <div id="error" class="error" role="alert" hidden></div>
</div>

int floorIdx(ivec2 l) {

  return 3;

int faceIdx(ivec2 l) {

  int bx = (l.x + (row % 2) * 4) % 8;
  int by = l.y % 4;
  if (bx == 7 || by == 3) return 1;
  if (by == 0) return 5;
  if (bx == 0) return 4;
  return 3;
